<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tadween</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1e22'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h8' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <a class="brand" href="#/">Tadween <span class="ar" lang="ar" dir="rtl">تدوين</span></a>
      <div class="side-actions">
        <a class="btn block" href="#/live" id="live-link"><span class="rec"></span><span id="live-label">Start live transcription</span><span id="live-time" class="num"></span></a>
        <label class="btn block">
          <input type="file" id="file-input" class="visually-hidden" accept="audio/*,video/*,.m4a,.mp3,.mp4,.wav,.mov,.webm,.ogg,.flac">
          Transcribe a recording…
        </label>
      </div>
      <div class="side-title" id="list-title">Transcripts</div>
      <ul id="transcript-list" aria-labelledby="list-title"></ul>
      <nav class="side-foot" aria-label="Library">
        <a class="nav-link" href="#/vocabulary">Word fixes</a>
        <a class="nav-link" href="#/people">Known voices</a>
        <a class="nav-link" href="#/settings">Settings</a>
      </nav>
    </aside>
    <div id="scrim"></div>
    <main id="main">
      <div id="topbar">
        <button class="icon-btn" id="menu-button" aria-label="Show transcripts" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
        </button>
        <a class="brand" href="#/">Tadween</a>
      </div>
      <div id="view"></div>
      <div id="player-bar" hidden></div>
    </main>
  </div>
  <div id="drop-overlay" hidden><div>Drop the recording to transcribe it</div></div>
  <div id="fix-button" hidden></div>
  <div id="popover" hidden></div>
  <div id="toast-area" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
